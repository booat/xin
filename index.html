<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>爱心便签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }

  /* ===== 开始界面 ===== */
  #landing {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1a1a2e; cursor: pointer;
    transition: opacity 0.6s ease-out;
  }
  #landing.hidden {
    opacity: 0; pointer-events: none;
  }
  #landing .heart-icon {
    font-size: 80px; animation: heartbeat 1.2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }
  #landing .title {
    color: #fff; font-size: 26px; font-weight: bold; margin-top: 20px;
  }
  #landing .subtitle {
    color: rgba(255,255,255,0.5); font-size: 15px; margin-top: 10px;
  }

  /* ===== 便签 ===== */
  .note {
    position: absolute; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; text-align: center; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    animation: fadeIn 0.8s ease-in forwards;
    transition: transform 0.15s;
  }
  .note:active { transform: scale(0.9); }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes floatAway {
    to { opacity: 0; transform: scale(0.3) translateY(-200px); }
  }
  .float-out { animation: floatAway 0.5s ease-out forwards !important; }

  #hint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 14px; z-index: 9999;
    pointer-events: none; transition: opacity 0.5s;
  }
  #stopBtn {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 30px; border-radius: 25px; font-size: 16px; z-index: 10000;
    cursor: pointer; backdrop-filter: blur(10px);
  }
  #stopBtn:active { background: rgba(255,255,255,0.3); }
  #musicBtn {
    position: fixed; top: 20px; right: 20px;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: white;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 24px; z-index: 10000; cursor: pointer;
    backdrop-filter: blur(10px); transition: background 0.3s;
  }
  #musicBtn:active { background: rgba(255,255,255,0.3); }
  #musicBtn.playing { background: rgba(255,140,200,0.3); border-color: rgba(255,140,200,0.5); }
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="landing" onclick="startApp()">
  <div class="heart-icon">❤️</div>
  <div class="title">点击开始</div>
  <div class="subtitle">一份小惊喜送给你</div>
</div>

<audio id="bgm" src="music.m4a" loop preload="auto"></audio>
<button id="musicBtn" onclick="toggleMusic()" title="音乐">🎵</button>
<button id="stopBtn" onclick="stopAll()">⏹ 结束</button>
<div id="hint">💡 点击便签可关闭 | 爱心展示后随机飘洒</div>

<script>
// ===== 配置 =====
const CONFIG = {
  noteW: 100,
  noteH: 48,
  total: 80,
  randomInterval: [10, 40],
  heartDelay: 500,
  autoStop: 15000,
};

const COLORS = ["#FF6B8A", "#FF8E6B", "#FFD93D", "#6BCB77", "#4D96FF", "#9B59B6", "#FF85A2", "#5DADE2"];
const TEXTS = [
  "每天都要开心呀", "好好吃饭哦", "别太累啦", "记得多喝水",
  "早点睡呀", "照顾好自己", "万事顺心～", "笑容常在呀",
  "好好生活", "放宽心哦", "元气满满每一天", "三餐都要好好吃",
  "愿你事事顺利", "好好休息呀", "保持好心情", "别胡思乱想啦",
  "日子甜甜的", "一定要快乐", "平安喜乐呀", "慢慢来就好",
  "我想你了", "我想你了", "我想你了", "我想你了",
];

const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
let randomTimer = null;
let stopTimer = null;
let stopped = false;
let started = false;

// ===== 心形坐标 =====
function heartPoints(n, sw, sh, nw, nh) {
  const pts = [];
  const scale = Math.min(sw, sh) / 45;
  const cx = sw / 2, cy = sh / 2 - sh * 0.04;
  for (let i = 0; i < n; i++) {
    const t = (i / n) * 2 * Math.PI;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    pts.push({ x: cx + x * scale - nw/2, y: cy - y * scale - nh/2 });
  }
  return pts;
}

// ===== 创建便签 =====
function createNote(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'note';
  el.style.cssText = `
    left:${x}px; top:${y}px;
    width:${CONFIG.noteW}px; height:${CONFIG.noteH}px;
    background:${color}; color:#fff; font-size:13px;
  `;
  el.textContent = text;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    el.classList.add('float-out');
    setTimeout(() => el.remove(), 500);
  });
  document.body.appendChild(el);
  return el;
}

// ===== 音乐控制 =====
function updateMusicUI(playing) {
  musicBtn.textContent = playing ? '🎶' : '🎵';
  musicBtn.classList.toggle('playing', playing);
}

function playMusic() {
  bgm.play().then(() => updateMusicUI(true)).catch(() => {});
}

function toggleMusic() {
  if (bgm.paused) { playMusic(); }
  else { bgm.pause(); updateMusicUI(false); }
}

// ===== 停止所有 =====
function stopAll() {
  stopped = true;
  clearTimeout(randomTimer);
  clearTimeout(stopTimer);
  document.querySelectorAll('.note').forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('float-out');
      setTimeout(() => el.remove(), 500);
    }, i * 30);
  });
  document.getElementById('hint').textContent = '✨ 感谢观看 ✨';
  document.getElementById('stopBtn').style.display = 'none';
}

// ===== 随机飘洒 =====
function randomSpawn() {
  if (stopped) return;
  const sw = window.innerWidth, sh = window.innerHeight;
  const x = Math.random() * (sw - CONFIG.noteW);
  const y = Math.random() * (sh - CONFIG.noteH);
  createNote(x, y, TEXTS[Math.floor(Math.random() * TEXTS.length)],
             COLORS[Math.floor(Math.random() * COLORS.length)]);
  randomTimer = setTimeout(randomSpawn,
    CONFIG.randomInterval[0] + Math.random() * (CONFIG.randomInterval[1] - CONFIG.randomInterval[0]));
}

// ===== 主流程 =====
function runHeart() {
  const sw = window.innerWidth, sh = window.innerHeight;
  const pts = heartPoints(CONFIG.total, sw, sh, CONFIG.noteW, CONFIG.noteH);

  pts.forEach((p, i) => {
    setTimeout(() => {
      const text = TEXTS[Math.floor(Math.random() * TEXTS.length)];
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      createNote(p.x, p.y, text, color);
      if (i === pts.length - 1) {
        document.getElementById('hint').textContent = '❤️ 爱心完成！15秒后自动停止...';
        setTimeout(() => {
          if (!stopped) {
            randomSpawn();
            stopTimer = setTimeout(() => stopAll(), CONFIG.autoStop);
          }
        }, CONFIG.heartDelay);
      }
    }, i * 12);
  });
}

// ===== 点击开始 =====
function startApp() {
  if (started) return;
  started = true;

  // 播放音乐
  playMusic();

  // 隐藏开始界面
  document.getElementById('landing').classList.add('hidden');
  setTimeout(() => document.getElementById('landing').remove(), 600);

  // 启动爱心
  runHeart();
}
</script>
</body>
</html>
